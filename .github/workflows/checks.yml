name: Checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: lint, tests, types, build (Node 24)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      NPM_CONFIG_UPDATE_NOTIFIER: "false"
      NEXT_PUBLIC_SUPABASE_URL: "http://127.0.0.1:54321"
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: "sb_publishable_ci_dummy_not_a_real_key"
      NEXT_PUBLIC_SUPABASE_ANON_KEY: "ci_dummy_not_a_real_anon_key"
      NEXT_PUBLIC_SITE_URL: "https://eventmap-ci.invalid"

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Reject tracked local configuration
        run: |
          node --input-type=module <<'NODE'
          import { execFileSync } from 'node:child_process';
          const files = execFileSync('git', ['ls-files', '-z'], { encoding: 'utf8' }).split('\0').filter(Boolean);
          const forbidden = files.filter(file =>
            /^(scratch\/|test_strony\/|\.vercel\/|supabase\/\.temp\/|client_secret_.*\.json$)/.test(file) ||
            (/^\.env(?:\.|$)/.test(file) && !['.env.example', '.env.sample'].includes(file))
          );
          if (forbidden.length) throw new Error(`Remove local-only files from Git: ${forbidden.join(', ')}`);
          NODE

      - name: Set up Node 24 LTS
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Block service traffic during application checks
        run: printf 'NODE_OPTIONS=--import=%s/.github/scripts/ci-network-guard.mjs\n' "$GITHUB_WORKSPACE" >> "$GITHUB_ENV"

      - name: Lint
        run: npm run lint

      - name: Unit and regression tests
        run: npm test

      - name: TypeScript
        run: npm run typecheck

      - name: Production build
        run: npm run build
